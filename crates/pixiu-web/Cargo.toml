[package]
name = "pixiu-web"
description = "The píxiū WebUI, built with Topcoat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pixiu-browser.workspace = true
pixiu-core.workspace = true
pixiu-db.workspace = true
pixiu-enrich.workspace = true
pixiu-hunt.workspace = true
pixiu-jobs.workspace = true
pixiu-treasury.workspace = true

form_urlencoded.workspace = true
hex.workspace = true
jiff.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
topcoat.workspace = true
tracing.workspace = true

[build-dependencies]
# `workspace = true` cannot be combined with `default-features = false`.
topcoat = { version = "=0.9.0", default-features = false, features = ["tailwind"] }

[lints]
workspace = true
