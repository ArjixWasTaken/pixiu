name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Full debug info makes `target/` outgrow the runner's disk; line tables
  # still give backtraces their file and line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runner image ships SDKs píxiū never uses; the build needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # FFmpeg's headers and libclang, for the bindings píxiū remuxes and
      # transcodes audio with.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The end-to-end tests bundle the WebUI assets themselves (fonts are
      # downloaded on the first run), so no Topcoat CLI is needed here.
      # Tests that need Chromium or YouTube are `#[ignore]`d.
      - name: Test
        run: cargo test --workspace --all-features
