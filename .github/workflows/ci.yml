name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # FFmpeg's headers and libclang, for the bindings píxiū remuxes audio
      # with.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The end-to-end tests bundle the WebUI assets themselves (fonts are
      # downloaded on the first run), so no Topcoat CLI is needed here.
      # Tests that need Chromium or YouTube are `#[ignore]`d.
      - name: Test
        run: cargo test --workspace --all-features
