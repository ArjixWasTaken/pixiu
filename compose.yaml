services:
  pixiu:
    build: .
    image: pixiu:latest
    ports:
      - "4533:4533"
    volumes:
      # Both directories must be writable by uid 1000 (the image's `pixiu`
      # user), or set `user:` to the owner of your directories.
      - ./data:/data
      - ./treasure:/treasure
    # environment:
    #   # Behind a reverse proxy (Caddy, nginx): throttles count requests by
    #   # the client address it passes in X-Forwarded-For.
    #   PIXIU_SERVER__TRUST_PROXY_HEADERS: "true"
    # To reach a mail server in another compose project, join its network
    # (and list `default` too, to keep this one's):
    # networks: [default, mail]
    restart: unless-stopped
    # Hardening: only the volumes and some scratch space are writable, and
    # nothing in the container can gain privileges.
    read_only: true
    tmpfs:
      # yt-dlp unpacks itself here, so it must allow running programs.
      - /tmp:exec,mode=1777
      # Caches of fonts, yt-dlp and Deno.
      - /home/pixiu:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

