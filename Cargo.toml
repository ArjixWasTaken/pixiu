[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
pixiu-core = { path = "crates/pixiu-core" }
pixiu-db = { path = "crates/pixiu-db" }
pixiu-subsonic = { path = "crates/pixiu-subsonic" }
pixiu-web = { path = "crates/pixiu-web" }

# Pinned exactly: both are early-stage and ship breaking changes in minor releases.
topcoat = { version = "=0.9.0", features = ["tower", "websocket", "multipart", "sse", "tailwind", "font-fontsource"] }
topcoat-asset = "=0.9.0"
toasty = { version = "=0.11.0", features = ["sqlite", "migration", "jiff", "serde"] }
toasty-cli = "=0.11.0"

anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2", "query", "form", "json"] }
bytes = "1"
figment = { version = "0.10.19", features = ["toml", "env"] }
form_urlencoded = "1"
futures-util = "0.3"
hex = "0.4"
jiff = "0.2"
quick-xml = "0.42"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time", "io-util"] }
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Test-only
insta = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "form", "json"] }
tempfile = "3"
tokio-tungstenite = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies rarely change; optimizing them keeps debug builds usable
# (argon2, image decoding and audio work are painfully slow unoptimized).
opt-level = 2
