# Copy to `pixiu.toml` (in the working directory, or point PIXIU_CONFIG at it).
# Every key can also be set from the environment: PIXIU_SERVER__PORT=4533.

[server]
# Loopback by default; use "0.0.0.0" to accept connections from the network.
host = "127.0.0.1"
port = 4533
# Behind a reverse proxy (Caddy, nginx), trust the client address it passes
# in X-Forwarded-For. Leave off when píxiū faces the internet directly.
trust_proxy_headers = false

[paths]
# Database, secrets and caches.
data_dir = "data"
# The music library. píxiū owns this directory; don't edit it by hand.
treasure_dir = "treasure"
# The web player's files. By default `web/` next to the binary, else
# `web/dist` (after `pnpm build` in a checkout).
# web_dir = "/opt/pixiu/web"

[browser]
# Chromium, for logging in to YouTube Music; found in PATH when unset.
# executable = "/usr/bin/chromium"
# Needed in most containers (the Docker image sets it).
no_sandbox = false
# How many browsers may run at once, for every user's YouTube Music sign-in
# and cookie refresh together. Each takes a few hundred megabytes.
max_open = 2

[hunt]
# rustypipe-botguard answers YouTube's proof-of-origin challenges, which lets
# píxiū fetch streams from more YouTube clients. Off when unset; yt-dlp
# fetches what the other clients cannot (today that is everything). The
# Docker image does not include it: it is only built for glibc.
# botguard = "/usr/local/bin/rustypipe-botguard"

[enrich]
# Albums are looked up on MusicBrainz (tags, covers from the Cover Art
# Archive), lyrics on LRCLIB, and artists on Wikipedia. MusicBrainz and
# Wikimedia ask applications for a way to reach whoever runs them: an email
# address or a URL of yours. It is sent (in the User-Agent) to those lookups
# only.
# contact = "you@example.com"

[stream]
# Clients may ask for another format (`format=mp3`, `opus`, `aac`), a lower
# bitrate (`maxBitRate`) or a later start (`timeOffset`); píxiū transcodes
# for them. When a client only asks for a lower bitrate and the file's own
# format cannot be made (FLAC, say), this one is used: mp3, opus or aac.
format = "mp3"
# Transcodes running at once, at most; more wait their turn.
max_transcodes = 4

[log]
# A tracing filter; RUST_LOG overrides it.
filter = "info"
