<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A song or album without a cover: a disc on a faint square, gray enough for light and dark themes. -->
  <rect width="100" height="100" fill="#808080" fill-opacity=".14"/>
  <circle cx="50" cy="50" r="21" fill="none" stroke="#808080" stroke-opacity=".6" stroke-width="4"/>
  <circle cx="50" cy="50" r="5" fill="#808080" fill-opacity=".6"/>
</svg>
